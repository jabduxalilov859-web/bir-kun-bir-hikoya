{% extends 'base.html' %}{% block content %}
<style>
.fav-header{padding:60px 0 28px}
.fav-title{font-size:48px;font-weight:800;letter-spacing:-1.5px;margin:0}
.fav-sub{color:var(--muted);font-size:16px;margin-top:12px}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;margin-top:24px}
.fav-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;transition:.3s}
.fav-card:hover{border-color:var(--text);transform:translateY(-2px)}
.fav-empty{text-align:center;padding:80px 20px;color:var(--muted);background:var(--card);border:1px dashed var(--border);border-radius:20px;margin-top:24px}
</style>

<div class="fav-header">
<h1 class="fav-title">Sevimlilar</h1>
<p class="fav-sub">Siz saqlagan hikoyalar — brauzer xotirasida saqlanadi</p>
</div>

<div id="fav-list" class="fav-grid"></div>

<script>
async function loadFavs(){
  let favs=JSON.parse(localStorage.getItem('favs')||'[]');
  let box=document.getElementById('fav-list');
  if(favs.length==0){
    box.innerHTML=`<div class="fav-empty"><div style="font-size:32px;margin-bottom:12px">⭐</div><div style="font-weight:700;color:var(--text)">Hali sevimlilar yo'q</div><div style="margin-top:8px">Kutubxonada istalgan hikoyada ⭐ Sevimli ni bosing</div><div style="margin-top:20px"><a href="/kutubxona" style="color:var(--text);font-weight:600">Kutubxonaga o'tish →</a></div></div>`;
    return;
  }
  box.innerHTML=favs.map(id=>`
    <div class="fav-card">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px">Saqlangan • #${id}</div>
      <div style="font-size:18px;font-weight:700;margin-bottom:12px">Hikoya #${id}</div>
      <a href="/hikoya/${id}" style="display:inline-flex;align-items:center;gap:6px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:100px;font-size:13px;font-weight:700;text-decoration:none">O'qish →</a>
    </div>
  `).join('');
}
loadFavs();
</script>
{% endblock %}
